<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>兩津商業銀行 AI 客服</title>
<style>
  :root {
    --bg: #f4f6f5; --panel: #ffffff; --ink: #1d2421; --muted: #66706b;
    --line: #dde3e0; --accent: #0b7a5a; --accent-ink: #ffffff; --bot: #eef3f1; --chip: #e4ece8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121614; --panel: #1a201d; --ink: #e6ece9; --muted: #95a19b;
      --line: #2c3530; --accent: #3fb88f; --accent-ink: #0d1411; --bot: #222a26; --chip: #26302b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }
  .wrap { max-width: 1280px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; padding: 0 16px; }
  header { padding: 20px 0 12px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-size: 20px; }
  .sub { color: var(--muted); font-size: 13px; }
  #cols { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 0; min-width: 0; }
  .col { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .col h2 { margin: 0 0 2px; font-size: 16px; }
  .col .desc { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .log { display: flex; flex-direction: column; gap: 14px; }
  .msg.error { border: 1px solid #c0392b; color: #c0392b; }
  @media (max-width: 720px) { #cols { grid-template-columns: 1fr; } }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 8px; white-space: normal; }
  .refs { margin-top: 8px; font-size: 13px; }
  details { margin-top: 6px; font-size: 13px; white-space: normal; }
  summary { cursor: pointer; color: var(--muted); }
  .hit { border-left: 3px solid var(--line); padding: 4px 10px; margin: 8px 0; }
  .hit b { font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 10px; }
  .chip { border: 0; background: var(--chip); color: var(--ink); padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; }
  form { display: flex; gap: 8px; padding: 12px 0 20px; position: sticky; bottom: 0; background: var(--bg); }
  input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); font: inherit; }
  button.send { border: 0; background: var(--accent); color: var(--accent-ink); padding: 0 18px; border-radius: 12px; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>兩津商業銀行 · AI 客服</h1>
    <div class="sub">RAG demo：先從知識庫找出相關段落，再由 AI 依段落回答並附上出處（虛構資料）</div>
  </header>
  <div id="cols">
    <section class="col" id="col-rag"><h2>純 RAG 機器人</h2><div class="desc">只做檢索，直接回最相關的知識庫段落</div><div class="log"></div></section>
    <section class="col" id="col-rag_llm"><h2>RAG＋LLM 機器人</h2><div class="desc">檢索後由 LLM 整理回答，記得前 3 輪對話</div><div class="log"></div></section>
  </div>
  <div class="chips" id="chips"></div>
  <form id="f">
    <input id="q" placeholder="輸入問題，例如：信用卡不見了怎麼辦？" autocomplete="off">
    <button class="send" id="b">送出</button>
  </form>
</div>
<script>
const samples = ["信用卡不見了怎麼辦？", "網銀轉帳一天上限多少？", "那手續費呢？", "房貸最多可以貸幾成？", "可以幫我買股票嗎？"];
const BOTS = ["rag", "rag_llm"];
const logs = {rag: document.querySelector("#col-rag .log"), rag_llm: document.querySelector("#col-rag_llm .log")};
const q = document.getElementById("q"), b = document.getElementById("b");
const sid = "web-" + Math.random().toString(36).slice(2, 8);

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

samples.forEach(s => { const c = el("button", "chip", s); c.type = "button"; c.onclick = () => send(s); document.getElementById("chips").append(c); });

function render(box, d) {
  box.textContent = d.answer;
  if (d.sources && d.sources.length) box.append(el("div", "refs", "📄 參考資料：" + d.sources.join("、")));
  if (d.retrieved && d.retrieved.length) {
    const det = el("details"); det.append(el("summary", null, `檢索到 ${d.retrieved.length} 段資料（點開看檢索結果）`));
    d.retrieved.forEach(h => {
      // 有幾種分數就顯示幾種：「相似度 0.62｜關鍵字 12.3」
      const scores = [];
      if (h.similarity != null) scores.push(`相似度 ${h.similarity.toFixed(2)}`);
      if (h.bm25 != null) scores.push(`關鍵字 ${h.bm25.toFixed(1)}`);
      const div = el("div", "hit"); div.append(el("b", null, `${h.label}　${scores.join("｜")}`)); div.append(el("div", null, h.text)); det.append(div);
    });
    box.append(det);
  }
  if (d.seconds) box.append(el("div", "meta", `${d.seconds} 秒 · ${d.provider}`));
}

// 兩邊各自等待、各自顯示：一邊慢或出錯，不影響另一邊
async function ask(bot, text) {
  const box = el("div", "msg bot", "查詢中…"); logs[bot].append(el("div", "msg user", text), box); box.scrollIntoView({behavior: "smooth", block: "nearest"});
  try {
    const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({message: text, session_id: sid, bot})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || d.answer || ("HTTP " + r.status));
    render(box, d);
  } catch (e) { box.classList.add("error"); box.textContent = "發生錯誤：" + (e.message || e); }
  box.scrollIntoView({behavior: "smooth", block: "nearest"});
}

async function send(text) {
  text = text.trim(); if (!text) return;
  q.value = ""; b.disabled = true;
  await Promise.allSettled(BOTS.map(bot => ask(bot, text)));
  b.disabled = false; q.focus();
}
document.getElementById("f").onsubmit = e => { e.preventDefault(); send(q.value); };
</script>
</body>
</html>
